# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: SIGVAR – ACL Special Interest Group on Similar Languages, Varieties, and Dialects # the website title (if blank, full name will be used instead)
title_short: SIGVAR
sigvar_long: ACL Special Interest Group on Similar Languages, Varieties, and Dialects
description: > # the ">" symbol means to ignore newlines until "footer_text:"
  ACL Special Interest Group on Similar Languages, Varieties, and Dialects
footer_text: >
  Contact: <a href="/members">SIGVAR Secretary</a>.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>, using a version of the <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
keywords:

lang: en # the language of your site (for example: en, fr, cn, ru, etc.)
icon:   # the emoji used as the favicon (alternatively, provide image name in /assets/img/)

url: https://aclsigvar.org # the base hostname & protocol for your site
baseurl: # the subpath of your site, e.g. /blog/
last_updated: false # set to true if you want to display last updated in the footer
impressum_path:  # set to path to include impressum link in the footer, use the same path as permalink in a page, helps to conform with EU GDPR

# -----------------------------------------------------------------------------
# RSS Feed
# -----------------------------------------------------------------------------
# will use title and url fields
# Take a look to https://github.com/jekyll/jekyll-feed for more customization

rss_icon: false

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: false

# Dimensions
max_width: 800px

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------
# Display links to the page with a preview object on social media.
serve_og_meta: false # Include Open Graph meta tags in the HTML head
serve_schema_org: false # Include Schema.org in the HTML head
og_image: # The site-wide (default for all links) Open Graph preview image

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

# blog_name: Blog # blog_name will be displayed in your blog page
# blog_nav_title: Blog # your blog must have a title for it to be displayed in the nav bar
# blog_description:
# permalink: /blog/:year/:title/

# # Pagination
# pagination:
#   enabled: true

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
highlight_theme_light: github  # https://github.com/jwarby/jekyll-pygments-themes
highlight_theme_dark: native  # https://github.com/jwarby/jekyll-pygments-themes
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & excludes
include: ['_pages']
exclude:
  - bin
  - Gemfile
  - Gemfile.lock
  - vendor
keep_files:
  - CNAME
  - .nojekyll
  - .git

# Plug-ins
plugins:
  - jekyll-archives  # todo: set up properly
  - jekyll-feed  # todo: check
  - jekyll-imagemagick
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll/scholar
  - jekyll-sitemap  # creates sitemap for search engines
  - jekyll-target-blank  # todo: check
  - jekyll-toc  # table of contents for, e.g., blog posts
# Removed (maybe re-enable [also in Gemfile etc. and re-add code based on removal commits / based on al-folio code] down the line):
#  - jekyll-diagrams
#  - jekyll-email-protect
#  - jemoji

# Sitemap settings
defaults:
  - scope:
      path: "assets/**/*.*"
    values:
      sitemap: false

# -----------------------------------------------------------------------------
# Jekyll Minifier
# -----------------------------------------------------------------------------

jekyll-minifier:
  exclude: ['robots.txt']

# -----------------------------------------------------------------------------
# Jekyll Archives
# -----------------------------------------------------------------------------

jekyll-archives:
  enabled: [year, tags, categories] # enables year, tag and category archives (remove if you need to disable one of them).
  layouts:
    year: archive-year
    tag: archive-tag
    category: archive-category
  permalinks:
    year: '/blog/:year/'
    tag: '/blog/tag/:name/'
    category: '/blog/category/:name/'

# display_tags: ['formatting', 'images', 'links', 'math', 'code'] # this tags will be displayed on the front page of your blog
display_tags: []

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:

  last_name: Blaschke
  first_name: [Verena, V.]

  style: apa # style doesn't matter, is set in _layouts/bib.html
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

# Filter out certain bibtex entry keywords used internally from the bib output
filtered_bibtex_keywords: [abstract, arxiv, bibtex_show, blog,
                           code, codedata, codenote,
                           data, day, display_title, doi_show,
                           frontnote, guidelines, hide_year, html,
                           invited_talk, model,
                           pdf, poster, preprint, press, preview,
                           selected, slides, summary, suppl,
                           venue, venue_url, video, website,
                           _video]

# -----------------------------------------------------------------------------
# Responsive WebP Images
# -----------------------------------------------------------------------------

enable_responsive_images: true # enables responsive images for your site (recommended, see https://github.com/alshedivat/al-folio/issues/537)

imagemagick:
  enabled: true # make it 'false' if not using responsive images
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
  output_formats:
    webp: "-quality 75%"

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_tooltips:            false  # enables automatic tooltip links generated
                                   # for each section titles on pages and posts
enable_darkmode:            false   # enables switching between light/dark modes

